  <script>
    // Each gym has its own colors (11/23/2026). Set them before the first paint, so the page doesn't
    // flash Iron View's navy first: signed in, the gym this phone last showed; signed out, the link's
    // ?gym=, else that one. app.js works it out properly once it runs.
    (function () {
      try {
        var ids = /^(ironview|okc|native|norman|downtown|tulsa)$/, g = '';
        var m = /[?&]gym=([a-z]+)(?:&|#|$)/i.exec(location.search);
        if (m && !localStorage.getItem('res27.token')) g = m[1].toLowerCase();
        if (!ids.test(g)) g = String(JSON.parse(localStorage.getItem('res27.gym') || '""'));
        if (ids.test(g)) document.documentElement.setAttribute('data-gym', g);
      } catch (e) { /* no storage: app.js sets it */ }
    })();
  </script>
